name: Commit Stage


on:
  push:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: aymanhamad2002/edge-service
  VERSION: ${{ github.sha }}
jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Code Vulnerability Scan
        uses: anchore/scan-action@v7
        with:
          path: "${{ github.workspace }}"
          fail-build: false
          severity-cutoff: high

      - name: Build, Unit Tests and Integration Tests
        run: |
          chmod +x gradlew
          ./gradlew clean build
          
      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: '5.7.1'

      - name: Set up kubeval
        env:
          KUBEVAL_VERSION: '0.16.1'
        run: |
          mkdir -p "$RUNNER_TEMP/kubeval"
          curl --fail --silent --show-error --location \
            "https://github.com/instrumenta/kubeval/releases/download/v${KUBEVAL_VERSION}/kubeval-linux-amd64.tar.gz" \
            --output "$RUNNER_TEMP/kubeval.tar.gz"
          tar -xzf "$RUNNER_TEMP/kubeval.tar.gz" -C "$RUNNER_TEMP/kubeval" kubeval
          echo "$RUNNER_TEMP/kubeval" >> "$GITHUB_PATH"

      - name: Generate Kubernetes manifests
        run: |
          mkdir -p build/k8s
          kustomize build k8s --output build/k8s/manifests.yml

      - name: Validate Kubernetes manifests with kubeval
        run: |
          kubeval --strict \
            --kubernetes-version 1.34.0 \
            --schema-location https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master \
            build/k8s/manifests.yml

  package:
      name: Package and Publish Docker Image
      if: ${{github.ref == 'refs/heads/main'}}
      needs: build
      runs-on: ubuntu-22.04
      permissions:
        contents: read
        packages: write
        security-events: write
      steps:
        - name: Checkout source code
          uses: actions/checkout@v4
        - name : Set up JDK 17
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '17'
            cache: gradle
        - name: Build container image
          run: |
            chmod +x gradlew
            ./gradlew bootBuildImage --imageName=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
        
        - name : OCI image vulnerability scan
          uses: anchore/scan-action@v7
          with:
            image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            fail-build: false
            severity-cutoff: high
        - name: login into github container registry
          uses: docker/login-action@v3
          with:
            registry: ${{ env.REGISTRY }}
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
        - name: Publish container image
          run: |
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
        - name: Tag container image as latest
          run: |
            docker tag \
            $ {{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }} \
            $ {{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest